<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KenLab Telecom Tools">
  <meta name="theme-color" content="#C62828">
  <title>KenLab — Herramientas de campo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #C62828; }
  </style>
</head>
<body>
  <script>
    window.kenlabCompass = {
      requestPermission: async function () {
        const Orientation = window.DeviceOrientationEvent;
        const Motion = window.DeviceMotionEvent;
        if (!Orientation && !Motion) return 'unsupported';
        try {
          const orientationPermission = Orientation && typeof Orientation.requestPermission === 'function'
            ? Orientation.requestPermission()
            : Promise.resolve('granted');
          const motionPermission = Motion && typeof Motion.requestPermission === 'function'
            ? Motion.requestPermission()
            : Promise.resolve('granted');
          const results = await Promise.all([orientationPermission, motionPermission]);
          if (results.some(result => result === 'denied')) return 'denied';
          return 'granted';
        } catch (_) {
          return 'denied';
        }
      },
      start: function (callback) {
        let orientation = null;
        let gravity = null;
        const publish = function () {
          const event = orientation;
          if (!event) {
            callback(null, null, null, false,
              gravity ? gravity.x : null,
              gravity ? gravity.y : null,
              gravity ? gravity.z : null);
            return;
          }
          const nativeHeading = Number.isFinite(event.webkitCompassHeading)
            ? event.webkitCompassHeading
            : null;
          const absoluteHeading = event.absolute && Number.isFinite(event.alpha)
            ? ((360 - event.alpha - (screen.orientation ? screen.orientation.angle : 0)) % 360 + 360) % 360
            : null;
          const heading = nativeHeading === null ? absoluteHeading : nativeHeading;
          callback(heading, event.beta, event.gamma, event.absolute === true,
            gravity ? gravity.x : null,
            gravity ? gravity.y : null,
            gravity ? gravity.z : null);
        };
        const onOrientation = function (event) {
          orientation = event;
          publish();
        };
        const onMotion = function (event) {
          const sample = event.accelerationIncludingGravity;
          if (sample && Number.isFinite(sample.x) && Number.isFinite(sample.y) && Number.isFinite(sample.z)) {
            gravity = { x: sample.x, y: sample.y, z: sample.z };
          }
          publish();
        };
        window.addEventListener('deviceorientation', onOrientation, true);
        window.addEventListener('deviceorientationabsolute', onOrientation, true);
        window.addEventListener('devicemotion', onMotion, true);
        window.__kenlabCompassStop = function () {
          window.removeEventListener('deviceorientation', onOrientation, true);
          window.removeEventListener('deviceorientationabsolute', onOrientation, true);
          window.removeEventListener('devicemotion', onMotion, true);
          window.__kenlabCompassStop = null;
        };
      },
      stop: function () {
        if (window.__kenlabCompassStop) window.__kenlabCompassStop();
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
