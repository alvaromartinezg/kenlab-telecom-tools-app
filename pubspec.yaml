name: kenlab_telecom_tools
description: A minimal Flutter application for KenLab Telecom Tools.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  archive: ^4.6.0
  camera: ^0.12.2
  file_picker: ^13.3.0
  file_saver: ^0.7.0
  flutter:
    sdk: flutter
  geolocator: ^14.1.2
  http: ^1.6.0
  image: ^4.12.0
  maplibre_gl: ^0.27.1
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
